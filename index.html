  <style>
    :root {
      --black: #000000;
      --emerald: #34e0a1;
      --forest: #0e3b2a;
      --ink: #e4f2eb;
      --sage: #7c948a;
      --hair: rgba(228, 242, 235, 0.09);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      background: var(--black);
      color: var(--ink);
      font-family: 'Hanken Grotesk', system-ui, sans-serif;
      font-weight: 300;
      font-size: 17px;
      line-height: 1.6;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }
    a:focus-visible { outline: 1px solid var(--emerald); outline-offset: 6px; border-radius: 2px; }

    /* ---------- Route network ---------- */
    #net {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* Soft vignette so edges fall to pure black */
    .vignette {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: radial-gradient(ellipse 75% 70% at 50% 45%, transparent 40%, #000 100%);
    }

    /* ---------- Header ---------- */
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 5;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 26px clamp(20px, 4vw, 48px);
      background: linear-gradient(#000 30%, rgba(0,0,0,0));
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: 'Unbounded', sans-serif;
      font-weight: 300;
      font-size: 14px;
      letter-spacing: 0.32em;
    }
    .brand img { width: 34px; height: 34px; mix-blend-mode: screen; transform: scale(1.9); }
    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      color: var(--sage);
    }
    .status b { font-weight: inherit; }
    .status i {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--emerald);
      animation: pulse 2.6s ease-out infinite;
    }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(52, 224, 161, 0.5); }
      100% { box-shadow: 0 0 0 11px rgba(52, 224, 161, 0); }
    }

    /* ---------- Hero ---------- */
    .hero {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 76px 20px 84px;
    }

    .mark {
      position: relative;
      width: min(540px, 92vw, 44vh);
      aspect-ratio: 1;
      margin: -4vh 0 -11vh;
    }
    .mark::before {
      content: "";
      position: absolute;
      inset: 26%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(52, 224, 161, 0.16), transparent 68%);
      filter: blur(24px);
      animation: breathe 6s ease-in-out infinite;
    }
    .mark img {
      position: relative;
      width: 100%;
      height: 100%;
      object-fit: contain;
      mix-blend-mode: screen; /* removes the logo's black square */
      opacity: 0;
      transform: translateY(28px) scale(0.96);
      filter: brightness(0.4);
      animation: rise 2.2s cubic-bezier(.16, .8, .24, 1) 0.15s forwards;
    }
    @keyframes rise {
      60%  { filter: brightness(1.35); }
      to   { opacity: 1; transform: none; filter: brightness(1); }
    }
    @keyframes breathe {
      0%, 100% { opacity: 0.7; transform: scale(1); }
      50%      { opacity: 1;   transform: scale(1.08); }
    }

    .wordmark {
      font-family: 'Unbounded', sans-serif;
      font-weight: 200;
      font-size: clamp(38px, min(9vw, 11vh), 108px);
      line-height: 1;
      letter-spacing: 0.34em;
      margin-right: -0.34em; /* optical centring of tracked type */
      display: flex;
      justify-content: center;
    }
    .wordmark span {
      display: inline-block;
      opacity: 0;
      transform: translateY(0.25em);
      filter: blur(8px);
      animation: letter 1.1s cubic-bezier(.2, .8, .2, 1) forwards;
    }
    .wordmark span:nth-child(1) { animation-delay: 1.10s; }
    .wordmark span:nth-child(2) { animation-delay: 1.18s; }
    .wordmark span:nth-child(3) { animation-delay: 1.26s; }
    .wordmark span:nth-child(4) { animation-delay: 1.34s; }
    .wordmark span:nth-child(5) { animation-delay: 1.42s; }
    .wordmark span:nth-child(6) { animation-delay: 1.50s; }
    @keyframes letter { to { opacity: 1; transform: none; filter: none; } }

    .what {
      margin-top: clamp(18px, 3.4vh, 34px);
      font-size: clamp(18px, 2.2vw, 23px);
      font-weight: 400;
      color: var(--ink);
      opacity: 0;
      animation: fade 1.2s ease 1.9s forwards;
    }
    .what::before {
      content: "";
      display: block;
      width: 1px;
      height: 34px;
      margin: 0 auto 22px;
      background: linear-gradient(var(--emerald), transparent);
    }

    .follow {
      position: relative;
      margin-top: clamp(22px, 4vh, 40px);
      padding: 15px 30px;
      font-size: 15px;
      font-weight: 500;
      color: var(--ink);
      border: 1px solid rgba(52, 224, 161, 0.35);
      border-radius: 999px;
      background: rgba(14, 59, 42, 0.25);
      backdrop-filter: blur(6px);
      overflow: hidden;
      transition: border-color .35s, color .35s, box-shadow .35s;
      opacity: 0;
      animation: fade 1.2s ease 2.2s forwards;
    }
    .follow::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%), rgba(52, 224, 161, 0.28), transparent 60%);
      opacity: 0;
      transition: opacity .35s;
    }
    .follow:hover { border-color: var(--emerald); box-shadow: 0 0 40px -8px rgba(52, 224, 161, 0.55); }
    .follow:hover::after { opacity: 1; }
    .follow span { position: relative; z-index: 1; }

    @keyframes fade { to { opacity: 1; } }

    .lede {
      margin-top: 10px;
      max-width: 34ch;
      font-size: clamp(15px, 1.6vw, 17px);
      color: var(--sage);
      text-wrap: balance;
      opacity: 0;
      animation: fade 1.2s ease 2.05s forwards;
    }

    /* ---------- Footer ---------- */
    footer {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin: 0 clamp(20px, 4vw, 48px);
      padding: 20px 0 max(24px, env(safe-area-inset-bottom, 0px));
      border-top: 1px solid var(--hair);
      font-size: 14px;
      color: var(--sage);
    }
    footer a { transition: color .3s; }
    footer a:hover { color: var(--emerald); }

    @media (max-width: 640px) {
      .status b { display: none; }
      .mark { margin: -20px 0 -70px; }
      .wordmark { letter-spacing: 0.26em; margin-right: -0.26em; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .mark img, .wordmark span, .what, .lede, .follow { opacity: 1; transform: none; filter: none; }
    }
  </style>
</head>

    <p class="what">An AI red teaming platform.</p>
    <p class="lede">Every AI system has a way in. Foinik finds it first.</p>

  <script>
    document.getElementById('yr').textContent = new Date().getFullYear();

    // Button glow follows the pointer
    const follow = document.getElementById('follow');
    follow.addEventListener('pointermove', e => {
      const r = follow.getBoundingClientRect();
      follow.style.setProperty('--mx', (e.clientX - r.left) + 'px');
      follow.style.setProperty('--my', (e.clientY - r.top) + 'px');
    });

    // ---------- Route network ----------
    (() => {
      const cv = document.getElementById('net');
      const ctx = cv.getContext('2d');
      const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
      let W, H, dpr, nodes = [], edges = [], adj = [];
      const pointer = { x: -9999, y: -9999, tx: -9999, ty: -9999, active: false };
      let route = null, nextRoute = 1800, t0 = performance.now();

      function build() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = cv.clientWidth; H = cv.clientHeight;
        cv.width = W * dpr; cv.height = H * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        // Jittered grid of nodes
        const gap = W < 640 ? 74 : 96;
        nodes = [];
        for (let y = -gap / 2; y < H + gap; y += gap) {
          for (let x = -gap / 2; x < W + gap; x += gap) {
            nodes.push({
              x: x + (Math.random() - 0.5) * gap * 0.8,
              y: y + (Math.random() - 0.5) * gap * 0.8,
              p: Math.random() * Math.PI * 2
            });
          }
        }
        // Connect each node to its 2–3 nearest neighbours
        edges = []; adj = nodes.map(() => []);
        const seen = new Set();
        nodes.forEach((a, i) => {
          const near = nodes
            .map((b, j) => ({ j, d: (a.x - b.x) ** 2 + (a.y - b.y) ** 2 }))
            .filter(o => o.j !== i)
            .sort((m, n) => m.d - n.d)
            .slice(0, 2 + (Math.random() < 0.4 ? 1 : 0));
          near.forEach(({ j }) => {
            const k = i < j ? i + '-' + j : j + '-' + i;
            if (!seen.has(k)) { seen.add(k); edges.push([i, j]); adj[i].push(j); adj[j].push(i); }
          });
        });
      }

      // A route walks from the lower edge toward the phoenix
      function makeRoute() {
        const m = document.querySelector('.mark').getBoundingClientRect();
        const cx = m.left + m.width / 2, cy = m.top + m.height * 0.45;
        const starts = nodes.map((n, i) => i).filter(i => nodes[i].y > H * 0.82 && nodes[i].x > 0 && nodes[i].x < W);
        if (!starts.length) return null;
        let cur = starts[Math.floor(Math.random() * starts.length)];
        const path = [cur], used = new Set([cur]);
        for (let s = 0; s < 40; s++) {
          const n = nodes[cur];
          if (Math.hypot(n.x - cx, n.y - cy) < Math.max(80, m.width * 0.22)) break;
          const opts = adj[cur].filter(j => !used.has(j));
          if (!opts.length) break;
          opts.sort((a, b) =>
            Math.hypot(nodes[a].x - cx, nodes[a].y - cy) - Math.hypot(nodes[b].x - cx, nodes[b].y - cy));
          cur = Math.random() < 0.78 ? opts[0] : opts[Math.floor(Math.random() * opts.length)];
          used.add(cur); path.push(cur);
        }
        let len = 0; const seg = [0];
        for (let i = 1; i < path.length; i++) {
          len += Math.hypot(nodes[path[i]].x - nodes[path[i - 1]].x, nodes[path[i]].y - nodes[path[i - 1]].y);
          seg.push(len);
        }
        return { path, seg, len, born: performance.now() };
      }

      function frame(now) {
        const t = (now - t0) / 1000;
        ctx.clearRect(0, 0, W, H);

        // Ease pointer; drift on its own when idle or on touch
        if (!pointer.active) {
          pointer.tx = W / 2 + Math.cos(t * 0.23) * W * 0.32;
          pointer.ty = H * 0.5 + Math.sin(t * 0.31) * H * 0.28;
        }
        pointer.x += (pointer.tx - pointer.x) * 0.08;
        pointer.y += (pointer.ty - pointer.y) * 0.08;
        const R = Math.max(W, H) * 0.22;

        // Edges
        for (const [i, j] of edges) {
          const a = nodes[i], b = nodes[j];
          const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
          const d = Math.hypot(mx - pointer.x, my - pointer.y);
          const lit = Math.max(0, 1 - d / R);
          ctx.strokeStyle = `rgba(52, 224, 161, ${0.055 + lit * lit * 0.42})`;
          ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        }
        // Nodes
        for (const n of nodes) {
          const d = Math.hypot(n.x - pointer.x, n.y - pointer.y);
          const lit = Math.max(0, 1 - d / R);
          const tw = 0.5 + 0.5 * Math.sin(t * 1.4 + n.p);
          ctx.fillStyle = `rgba(228, 242, 235, ${0.09 + lit * 0.55 + tw * 0.04})`;
          ctx.beginPath(); ctx.arc(n.x, n.y, 1.1 + lit * 1.2, 0, Math.PI * 2); ctx.fill();
        }

        // Tracing route
        if (!route && now > nextRoute) route = makeRoute();
        if (route) {
          const age = (now - route.born) / 1000;
          const travel = Math.min(1, age / 2.6);
          const fadeOut = age > 3.6 ? Math.max(0, 1 - (age - 3.6) / 1.2) : 1;
          const reach = route.len * (1 - Math.pow(1 - travel, 3));
          ctx.lineCap = 'round';
          ctx.shadowColor = 'rgba(52, 224, 161, 0.9)';
          ctx.shadowBlur = 12;
          ctx.strokeStyle = `rgba(52, 224, 161, ${0.85 * fadeOut})`;
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          let head = null;
          for (let i = 0; i < route.path.length; i++) {
            const n = nodes[route.path[i]];
            if (i === 0) { ctx.moveTo(n.x, n.y); continue; }
            const p = nodes[route.path[i - 1]];
            if (route.seg[i] <= reach) { ctx.lineTo(n.x, n.y); head = n; }
            else {
              const f = (reach - route.seg[i - 1]) / (route.seg[i] - route.seg[i - 1]);
              if (f > 0) { head = { x: p.x + (n.x - p.x) * f, y: p.y + (n.y - p.y) * f }; ctx.lineTo(head.x, head.y); }
              break;
            }
          }
          ctx.stroke();
          // Visited nodes
          for (let i = 0; i < route.path.length; i++) {
            if (route.seg[i] > reach) break;
            const n = nodes[route.path[i]];
            ctx.fillStyle = `rgba(52, 224, 161, ${fadeOut})`;
            ctx.beginPath(); ctx.arc(n.x, n.y, 2.4, 0, Math.PI * 2); ctx.fill();
          }
          // Spark at the head
          if (head && travel < 1) {
            ctx.shadowBlur = 24;
            ctx.fillStyle = '#e4f2eb';
            ctx.beginPath(); ctx.arc(head.x, head.y, 2.8, 0, Math.PI * 2); ctx.fill();
          }
          ctx.shadowBlur = 0;
          if (fadeOut <= 0) { route = null; nextRoute = now + 1400 + Math.random() * 1600; }
        }

        if (!reduce) requestAnimationFrame(frame);
      }

      addEventListener('pointermove', e => {
        if (e.pointerType === 'touch') return;
        pointer.active = true; pointer.tx = e.clientX; pointer.ty = e.clientY;
      });
      document.addEventListener('pointerleave', () => { pointer.active = false; });
      let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { build(); if (reduce) frame(performance.now()); }, 150); });

      build();
      if (reduce) { pointer.x = pointer.tx = W / 2; pointer.y = pointer.ty = H / 2; frame(performance.now()); }
      else requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
